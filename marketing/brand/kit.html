<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@500;600;700&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{background:transparent}
.a{position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#fff;display:none}
.a.on{display:block}
.mark{display:block}
.logo{display:flex;align-items:center}
.logo .t b{font-family:Oswald;font-weight:700;display:block;line-height:.9;letter-spacing:.04em}
.logo .t span{font-family:Oswald;font-weight:500;display:block;line-height:1;letter-spacing:.44em;color:#f2b705}
.green .t b{color:#0d4f34}
.bg{background:#0d4f34}
.bg::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 100% 110%,rgba(242,183,5,.22),transparent 55%),radial-gradient(ellipse at 0% -10%,rgba(255,255,255,.10),transparent 55%)}
.pitch{position:absolute;inset:0;opacity:.1}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.tag{font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.bar{position:absolute;left:0;bottom:0;right:0;background:#f2b705}
</style></head><body>
<!-- mark/logo builders -->
<script>
const M=(size,stroke='#fff')=>`<svg class="mark" viewBox="0 0 64 64" width="${size}" height="${size}"><circle cx="32" cy="32" r="28" fill="none" stroke="${stroke}" stroke-width="5"/><path d="M6 34 H19 L24 22 L31 44 L37 28 L41 34 H58" fill="none" stroke="#f2b705" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOGO=(h,green)=>`<div class="logo ${green?'green':''}" style="gap:${h*.2}px">${M(h,green?'#0d4f34':'#fff')}<div class="t"><b style="font-size:${h*.68}px">KORA</b><span style="font-size:${h*.31}px;margin-top:${h*.02}px">PULSE</span></div></div>`;
const PITCH=`<svg class="pitch" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#fff" stroke-width="3"><rect x="40" y="30" width="720" height="390"/><line x1="400" y1="30" x2="400" y2="420"/><circle cx="400" cy="225" r="70"/><rect x="40" y="130" width="110" height="190"/><rect x="650" y="130" width="110" height="190"/></g></svg>`;
const A={
 // transparent logos
 'logo-white':{w:2000,h:640,t:true,html:`<div class="center">${LOGO(520)}</div>`},
 'logo-green':{w:2000,h:640,t:true,html:`<div class="center">${LOGO(520,true)}</div>`},
 'icon-white':{w:1024,h:1024,t:true,html:`<div class="center">${M(960)}</div>`},
 'icon-green':{w:1024,h:1024,t:true,html:`<div class="center">${M(960,'#0d4f34')}</div>`},
 'watermark-white':{w:640,h:200,t:true,html:`<div class="center" style="opacity:1">${LOGO(160)}</div>`},
 // profile pictures (circle-safe)
 'profile-green':{w:1080,h:1080,html:`<div class="bg" style="position:absolute;inset:0"></div>${PITCH}<div class="center">${M(620)}</div>`},
 'profile-gold':{w:1080,h:1080,html:`<div style="position:absolute;inset:0;background:#f2b705"></div><div class="center"><svg viewBox="0 0 64 64" width="620" height="620"><circle cx="32" cy="32" r="28" fill="none" stroke="#0d4f34" stroke-width="5"/><path d="M6 34 H19 L24 22 L31 44 L37 28 L41 34 H58" fill="none" stroke="#0d4f34" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`},
 'profile-dark':{w:1080,h:1080,html:`<div style="position:absolute;inset:0;background:#0d1310"></div><div class="center">${M(620)}</div>`},
 'profile-wordmark':{w:1080,h:1080,html:`<div class="bg" style="position:absolute;inset:0"></div>${PITCH}<div class="center">${LOGO(250)}</div>`},
 // covers
 'facebook-cover':{w:1640,h:624,html:`<div class="bg" style="position:absolute;inset:0"></div>${PITCH}<div class="center" style="padding-top:20px">${LOGO(200)}<p class="tag" style="font-size:30px;margin-top:34px">Football news · Morocco · Africa · World</p><p style="font:700 34px Cairo;margin-top:14px;opacity:.9" dir="rtl">أخبار كرة القدم من المغرب وإفريقيا والعالم</p></div><div class="bar" style="height:12px"></div>`},
 'x-header':{w:1500,h:500,html:`<div class="bg" style="position:absolute;inset:0"></div>${PITCH}<div class="center" style="padding-left:260px">${LOGO(170)}<p class="tag" style="font-size:26px;margin-top:28px">Football news · Morocco · Africa · World</p></div><div class="bar" style="height:10px"></div>`},
 'youtube-banner':{w:2560,h:1440,html:`<div class="bg" style="position:absolute;inset:0"></div>${PITCH}<div class="center">${LOGO(250)}<p class="tag" style="font-size:40px;margin-top:40px">Football news · Morocco · Africa · World</p></div><div class="bar" style="height:16px"></div>`},
 // video montage
 'lower-third':{w:1920,h:1080,t:true,html:`<div style="position:absolute;left:90px;bottom:110px;display:flex;align-items:stretch;height:120px;box-shadow:0 10px 40px rgba(0,0,0,.35)"><div style="background:#0d4f34;display:flex;align-items:center;padding:0 26px">${M(78)}</div><div style="background:#fff;width:980px;border-left:10px solid #f2b705"></div></div><div style="position:absolute;left:90px;bottom:84px;width:1210px;height:8px;background:#f2b705"></div>`},
 'end-card-16x9':{w:1920,h:1080,html:`<div class="bg" style="position:absolute;inset:0"></div>${PITCH}<div class="center">${LOGO(240)}<p style="font:700 54px Oswald;letter-spacing:.06em;margin-top:60px;text-transform:uppercase">Follow us for more football</p><p class="tag" style="font-size:30px;margin-top:22px">Suivez-nous · <span style="font-family:Cairo;letter-spacing:0">تابعونا</span></p></div><div class="bar" style="height:14px"></div>`},
 'end-card-9x16':{w:1080,h:1920,html:`<div class="bg" style="position:absolute;inset:0"></div>${PITCH}<div class="center">${M(380)}<div class="logo" style="margin-top:46px;flex-direction:column;align-items:center"><div class="t" style="text-align:center"><b style="font-size:150px">KORA</b><span style="font-size:66px;margin-top:6px;padding-left:.44em">PULSE</span></div></div><p style="font:700 56px/1.15 Oswald;letter-spacing:.05em;margin-top:80px;text-transform:uppercase;text-align:center">Follow us<br>for more football</p><p class="tag" style="font-size:32px;margin-top:30px">Suivez-nous · <span style="font-family:Cairo;letter-spacing:0">تابعونا</span></p></div><div class="bar" style="height:16px"></div>`}
};
function show(k){const a=A[k];document.body.innerHTML=`<div class="a on" style="width:${a.w}px;height:${a.h}px">${a.html}</div>`;return {w:a.w,h:a.h,t:!!a.t};}
window.KIT=Object.keys(A);
</script></body></html>
